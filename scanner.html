<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Escáner de Fichas Físicas - Protobject</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  
  <!-- Framework Oficial de Protobject -->
  <script src="https://app.protobject.com/framework/p.js"></script>
  <script src="config.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card: #131a29;
      --t1: #ef4444; /* Ficha 1: Roja */
      --t2: #22c55e; /* Ficha 2: Verde */
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Barra Superior */
    .header {
      background: rgba(19, 26, 41, 0.95);
      backdrop-filter: blur(8px);
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      z-index: 50;
    }

    .brand {
      font-weight: 800;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand span {
      background: linear-gradient(135deg, #ef4444, #22c55e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-pill {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* Contenedor Principal de Visión */
    .viewport {
      position: relative;
      flex: 1;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #camera-video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Marco de Aspecto Exacto del Mapa Impreso (876 / 1024) */
    .map-frame-box {
      position: relative;
      width: 90vw;
      max-width: 400px;
      aspect-ratio: 876 / 1024;
      border: 2px dashed rgba(56, 189, 248, 0.85);
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(56, 189, 248, 0.2);
      overflow: hidden;
      z-index: 10;
    }

    #map-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      opacity: 0.35;
      pointer-events: none;
      filter: drop-shadow(0 0 10px rgba(0, 40, 130, 0.6));
      z-index: 1;
    }

    #tracking-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      cursor: crosshair;
    }

    /* Controles Superiores Flotantes */
    .top-controls {
      position: absolute;
      top: 6px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
      pointer-events: none;
    }

    .alignment-hint {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.68rem;
      font-weight: 700;
      color: #e2e8f0;
      pointer-events: auto;
    }

    .tools-bar {
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }

    .tool-btn {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #334155;
      color: white;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 0.68rem;
      font-weight: 700;
      cursor: pointer;
    }
    .tool-btn.active {
      background: #2563eb;
      border-color: #60a5fa;
    }

    /* Selector de Ficha Activa para Toque */
    .token-bar {
      display: flex;
      gap: 6px;
      background: #0f172a;
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      z-index: 40;
    }

    .token-select-btn {
      flex: 1;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid transparent;
      font-weight: 800;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .token-select-btn.t1 { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .token-select-btn.t1.active { background: #ef4444; color: white; }
    .token-select-btn.t2 { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
    .token-select-btn.t2.active { background: #22c55e; color: white; }

    /* HUD INFERIOR */
    .hud {
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 40;
    }

    .hud-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .token-card {
      background: #0f172a;
      border-radius: 8px;
      padding: 8px 10px;
      border: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .token-card.t1 { border-left: 4px solid var(--t1); }
    .token-card.t2 { border-left: 4px solid var(--t2); }

    .token-header {
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .t1 .token-header { color: var(--t1); }
    .t2 .token-header { color: var(--t2); }

    .token-country {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .token-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      font-weight: 700;
    }
    .token-meta.active { color: #f59e0b; }

    .remove-btn {
      background: #334155;
      border: none;
      color: #cbd5e1;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.65rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Barra Superior -->
  <header class="header">
    <div class="brand">
      <span>💨 Escáner Físico Protobject</span>
    </div>
    <div class="status-pill">
      <span class="status-dot"></span>
      <span id="proto-status">Protobject Enlazado</span>
    </div>
  </header>

  <!-- Barra de Ficha Activa (Permite colocar ficha con cámara O tocando la pantalla) -->
  <div class="token-bar">
    <button id="btn-tab-t1" class="token-select-btn t1 active" onclick="setActiveToken(1)">🔴 Ficha 1 (Turbina 1)</button>
    <button id="btn-tab-t2" class="token-select-btn t2" onclick="setActiveToken(2)">🟢 Ficha 2 (Turbina 2)</button>
  </div>

  <!-- Área de Visión por Computador -->
  <main class="viewport">
    <video id="camera-video" autoplay playsinline muted></video>
    
    <!-- Marco de Aspecto Exacto del Mapa Impreso (876 / 1024) -->
    <div class="map-frame-box" id="map-frame">
      <img id="map-overlay" src="mapa_impreso.jpg" alt="Alineación del Mapa">
      <canvas id="tracking-canvas"></canvas>
    </div>

    <!-- Controles Superiores Flotantes -->
    <div class="top-controls">
      <div class="alignment-hint" id="main-hint">
        📐 Encuadra el mapa en el marco o toca un país
      </div>
      <div class="tools-bar">
        <button class="tool-btn active" id="btn-toggle-labels" onclick="toggleCountryLabels()">🏷️ Países</button>
      </div>
    </div>
  </main>

  <!-- HUD INFERIOR -->
  <section class="hud">
    <div class="hud-grid">
      <!-- Ficha Física 1 (Turbina 1) -->
      <div class="token-card t1">
        <div class="token-header">
          <span>🔴 Ficha 1 (T1)</span>
          <button class="remove-btn" onclick="removeToken(1)">✕ Quitar</button>
        </div>
        <div class="token-country" id="t1-country-name">— No detectada —</div>
        <div class="token-meta" id="t1-meta">Pon la ficha o toca el país</div>
      </div>

      <!-- Ficha Física 2 (Turbina 2) -->
      <div class="token-card t2">
        <div class="token-header">
          <span>🟢 Ficha 2 (T2)</span>
          <button class="remove-btn" onclick="removeToken(2)">✕ Quitar</button>
        </div>
        <div class="token-country" id="t2-country-name">— No detectada —</div>
        <div class="token-meta" id="t2-meta">Pon la ficha o toca el país</div>
      </div>
    </div>
  </section>

  <!-- Canvas interno de análisis a alta velocidad -->
  <canvas id="proc-canvas" width="220" height="256" style="display:none;"></canvas>

  <script>
    // Coordenadas normalizadas (X, Y) y radio r verificadas en mapa_impreso.jpg (876x1024)
    const COUNTRIES = [
      { name: "Canada", flag: "🇨🇦", x: 0.350, y: 0.150, r: 0.200, wind: "8.0%" },
      { name: "United States", flag: "🇺🇸", x: 0.350, y: 0.280, r: 0.130, wind: "10.3%" },
      { name: "Mexico", flag: "🇲🇽", x: 0.315, y: 0.420, r: 0.080, wind: "5.6%" },
      { name: "Cuba", flag: "🇨🇺", x: 0.463, y: 0.420, r: 0.050, wind: "0.4%" },
      { name: "Guatemala", flag: "🇬🇹", x: 0.380, y: 0.470, r: 0.035, wind: "2.5%" },
      { name: "Honduras", flag: "🇭🇳", x: 0.403, y: 0.472, r: 0.035, wind: "9.2%" },
      { name: "Nicaragua", flag: "🇳🇮", x: 0.420, y: 0.500, r: 0.035, wind: "14.8%" },
      { name: "Costa Rica", flag: "🇨🇷", x: 0.430, y: 0.520, r: 0.030, wind: "13.1%" },
      { name: "Panama", flag: "🇵🇦", x: 0.460, y: 0.530, r: 0.035, wind: "7.1%" },
      { name: "Colombia", flag: "🇨🇴", x: 0.500, y: 0.580, r: 0.065, wind: "0.2%" },
      { name: "Venezuela", flag: "🇻🇪", x: 0.570, y: 0.560, r: 0.070, wind: "0.1%" },
      { name: "Ecuador", flag: "🇪🇨", x: 0.470, y: 0.620, r: 0.045, wind: "0.4%" },
      { name: "Peru", flag: "🇵🇪", x: 0.490, y: 0.670, r: 0.075, wind: "3.7%" },
      { name: "Bolivia", flag: "🇧🇴", x: 0.560, y: 0.730, r: 0.065, wind: "2.0%" },
      { name: "Brazil", flag: "🇧🇷", x: 0.650, y: 0.700, r: 0.150, wind: "15.2%" },
      { name: "Paraguay", flag: "🇵🇾", x: 0.580, y: 0.770, r: 0.050, wind: "0.0%" },
      { name: "Uruguay", flag: "🇺🇾", x: 0.620, y: 0.820, r: 0.045, wind: "40.6%" },
      { name: "Chile", flag: "🇨🇱", x: 0.550, y: 0.860, r: 0.045, wind: "13.1%" },
      { name: "Argentina", flag: "🇦🇷", x: 0.585, y: 0.860, r: 0.075, wind: "12.2%" }
    ];

    let activeSelectedToken = 1;
    let currentT1Country = null;
    let currentT2Country = null;
    let t1MissingFrames = 0;
    let t2MissingFrames = 0;

    let showCountryLabels = true;

    function toggleCountryLabels() {
      showCountryLabels = !showCountryLabels;
      document.getElementById("btn-toggle-labels").classList.toggle("active", showCountryLabels);
    }

    function setActiveToken(num) {
      activeSelectedToken = num;
      document.getElementById("btn-tab-t1").classList.toggle("active", num === 1);
      document.getElementById("btn-tab-t2").classList.toggle("active", num === 2);
    }

    // Al tocar la pantalla: si la cámara no detecta la ficha por mala iluminación,
    // el usuario puede simplemente TOCAR sobre el país en la pantalla y se activa de inmediato
    document.getElementById("tracking-canvas").addEventListener("pointerdown", (e) => {
      const rect = e.target.getBoundingClientRect();
      const normX = (e.clientX - rect.left) / rect.width;
      const normY = (e.clientY - rect.top) / rect.height;

      const tapped = findCountryAt(normX, normY);
      if (tapped) {
        if (activeSelectedToken === 1) {
          handleToken1Detected(tapped);
        } else {
          handleToken2Detected(tapped);
        }
      }
    });

    function removeToken(num) {
      if (num === 1) {
        handleToken1Lost();
      } else {
        handleToken2Lost();
      }
    }

    // Conversión RGB a HSV
    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, v = max;
      const d = max - min;
      s = max === 0 ? 0 : d / max;
      if (max === min) {
        h = 0;
      } else {
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [h * 360, s, v];
    }

    async function initCamera() {
      const video = document.getElementById("camera-video");
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          requestAnimationFrame(processLoop);
        };
      } catch (err) {
        console.error("Error al iniciar cámara:", err);
        document.getElementById("main-hint").textContent = "Permiso de cámara denegado. Toca los países en pantalla.";
      }
    }

    function processLoop() {
      const video = document.getElementById("camera-video");
      const overlayCanvas = document.getElementById("tracking-canvas");
      const procCanvas = document.getElementById("proc-canvas");
      const mapFrame = document.getElementById("map-frame");

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        overlayCanvas.width = mapFrame.clientWidth;
        overlayCanvas.height = mapFrame.clientHeight;
        const ctxOverlay = overlayCanvas.getContext("2d");
        ctxOverlay.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

        // Dibujar nombres de los países para que el usuario compruebe la alineación
        if (showCountryLabels) {
          drawCountryMapHints(ctxOverlay, overlayCanvas.width, overlayCanvas.height);
        }

        // Si hay una ficha fijada (por toque o detección), mantenerla dibujada
        if (currentT1Country) {
          const c1 = COUNTRIES.find(c => c.name === currentT1Country);
          if (c1) drawSight(ctxOverlay, c1.x * overlayCanvas.width, c1.y * overlayCanvas.height, "#ef4444", "FICHA 1 (T1)");
        }
        if (currentT2Country) {
          const c2 = COUNTRIES.find(c => c.name === currentT2Country);
          if (c2) drawSight(ctxOverlay, c2.x * overlayCanvas.width, c2.y * overlayCanvas.height, "#22c55e", "FICHA 2 (T2)");
        }

        // Extraer los píxeles de la cámara en el área exacta del marco
        const frameRect = mapFrame.getBoundingClientRect();
        const videoRect = video.getBoundingClientRect();

        const sx = ((frameRect.left - videoRect.left) / videoRect.width) * video.videoWidth;
        const sy = ((frameRect.top - videoRect.top) / videoRect.height) * video.videoHeight;
        const sw = (frameRect.width / videoRect.width) * video.videoWidth;
        const sh = (frameRect.height / videoRect.height) * video.videoHeight;

        const ctxProc = procCanvas.getContext("2d");
        try {
          ctxProc.drawImage(video, Math.max(0, sx), Math.max(0, sy), Math.max(10, sw), Math.max(10, sh), 0, 0, 220, 256);
        } catch(e) {
          ctxProc.drawImage(video, 0, 0, 220, 256);
        }
        const frameData = ctxProc.getImageData(0, 0, 220, 256).data;

        let sumX1 = 0, sumY1 = 0, count1 = 0;
        let sumX2 = 0, sumY2 = 0, count2 = 0;

        for (let y = 0; y < 256; y += 2) {
          for (let x = 0; x < 220; x += 2) {
            const i = (y * 220 + x) * 4;
            const r = frameData[i];
            const g = frameData[i + 1];
            const b = frameData[i + 2];

            const [h, s, v] = rgbToHsv(r, g, b);

            // Detección Ficha 1 Roja: (Hue < 28 o > 330, saturación y brillo visible)
            if (s >= 0.25 && v >= 0.20 && (h <= 28 || h >= 330) && (r > g + 25 && r > b + 25)) {
              sumX1 += x; sumY1 += y; count1++;
            }
            // Detección Ficha 2 Verde: (Hue entre 65 y 175)
            else if (s >= 0.20 && v >= 0.18 && (h >= 65 && h <= 175) && (g > r + 15 && g > b + 15)) {
              sumX2 += x; sumY2 += y; count2++;
            }
          }
        }

        // Si la cámara ve la Ficha 1 roja con al menos 10 píxeles compactos
        if (count1 >= 10) {
          t1MissingFrames = 0;
          const normX = (sumX1 / count1) / 220;
          const normY = (sumY1 / count1) / 256;
          const detected = findCountryAt(normX, normY);
          if (detected) {
            handleToken1Detected(detected);
          }
        }

        // Si la cámara ve la Ficha 2 verde con al menos 10 píxeles compactos
        if (count2 >= 10) {
          t2MissingFrames = 0;
          const normX = (sumX2 / count2) / 220;
          const normY = (sumY2 / count2) / 256;
          const detected = findCountryAt(normX, normY);
          if (detected) {
            handleToken2Detected(detected);
          }
        }
      }

      requestAnimationFrame(processLoop);
    }

    function drawCountryMapHints(ctx, w, h) {
      ctx.save();
      for (const c of COUNTRIES) {
        const cx = c.x * w;
        const cy = c.y * h;

        ctx.beginPath();
        ctx.arc(cx, cy, 3, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(56, 189, 248, 0.5)";
        ctx.fill();

        ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
        ctx.font = "bold 8.5px 'Plus Jakarta Sans'";
        ctx.textAlign = "center";
        ctx.fillText(c.name, cx, cy - 5);
      }
      ctx.restore();
    }

    function findCountryAt(nx, ny) {
      let closest = null;
      let minDistance = 999;

      for (const c of COUNTRIES) {
        const dx = nx - c.x;
        const dy = ny - c.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist <= c.r && dist < minDistance) {
          minDistance = dist;
          closest = c;
        }
      }
      return closest;
    }

    function drawSight(ctx, x, y, color, label) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, 22, 0, Math.PI * 2);
      ctx.strokeStyle = color;
      ctx.lineWidth = 3.5;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x - 28, y); ctx.lineTo(x + 28, y);
      ctx.moveTo(x, y - 28); ctx.lineTo(x, y + 28);
      ctx.strokeStyle = "rgba(255,255,255,0.8)";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = "rgba(15, 23, 42, 0.92)";
      ctx.fillRect(x - 45, y - 42, 90, 18);
      ctx.strokeStyle = color;
      ctx.strokeRect(x - 45, y - 42, 90, 18);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 9px 'Plus Jakarta Sans'";
      ctx.textAlign = "center";
      ctx.fillText(label, x, y - 29);
      ctx.restore();
    }

    function handleToken1Detected(country) {
      const nameEl = document.getElementById("t1-country-name");
      const metaEl = document.getElementById("t1-meta");

      if (currentT1Country !== country.name) {
        currentT1Country = country.name;
        nameEl.textContent = `${country.flag} ${country.name}`;
        metaEl.textContent = `Viento máx: ${country.wind}`;
        metaEl.className = "token-meta active";

        sendToProtobject(1, "set_country", country.name);
      }
    }

    function handleToken1Lost() {
      currentT1Country = null;
      document.getElementById("t1-country-name").textContent = "— Levantada —";
      document.getElementById("t1-meta").textContent = "Turbina detenida";
      document.getElementById("t1-meta").className = "token-meta";

      sendToProtobject(1, "remove", null);
    }

    function handleToken2Detected(country) {
      const nameEl = document.getElementById("t2-country-name");
      const metaEl = document.getElementById("t2-meta");

      if (currentT2Country !== country.name) {
        currentT2Country = country.name;
        nameEl.textContent = `${country.flag} ${country.name}`;
        metaEl.textContent = `Viento máx: ${country.wind}`;
        metaEl.className = "token-meta active";

        sendToProtobject(2, "set_country", country.name);
      }
    }

    function handleToken2Lost() {
      currentT2Country = null;
      document.getElementById("t2-country-name").textContent = "— Levantada —";
      document.getElementById("t2-meta").textContent = "Turbina detenida";
      document.getElementById("t2-meta").className = "token-meta";

      sendToProtobject(2, "remove", null);
    }

    function sendToProtobject(turbineId, action, countryName) {
      try {
        if (window.Protobject && window.Protobject.Core) {
          Protobject.Core.send({
            turbine: turbineId,
            action: action,
            country: countryName
          }).to("index.html");
          console.log(`[PROTOBJECT] Enviado T${turbineId}: ${action} ${countryName || ''}`);
        }
      } catch(e) {
        console.warn("Protobject error:", e);
      }
    }

    try {
      if (window.Protobject && window.Protobject.Core) {
        Protobject.Core.onReceived(function(data) {
          if (data && data.type === "SYNC") {
            const meta = document.getElementById(`t${data.turbine}-meta`);
            if (meta) {
              meta.textContent = `Año: ${data.year} • ${data.share}% viento`;
            }
          }
        });
      }
    } catch(e) {}

    window.addEventListener("DOMContentLoaded", () => {
      initCamera();
    });
  </script>
</body>
</html>
