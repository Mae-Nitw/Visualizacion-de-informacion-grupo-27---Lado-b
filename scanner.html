<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Escáner Protobject - Turbinas Eólicas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
  
  <!-- Framework Oficial de Protobject -->
  <script src="https://app.protobject.com/framework/p.js"></script>
  <script src="config.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card: #131a29;
      --t1: #0ea5e9; /* Turbina 1: Cyan / Azul */
      --t2: #10b981; /* Turbina 2: Verde esmeralda */
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Cabecera */
    .header {
      background: rgba(19, 26, 41, 0.9);
      backdrop-filter: blur(8px);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      font-weight: 800;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand span {
      background: linear-gradient(135deg, var(--t1), var(--t2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .proto-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* Selector de Ficha */
    .token-selector {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      background: #0f172a;
      border-bottom: 1px solid var(--border);
    }

    .token-btn {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: 2px solid transparent;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .token-btn.t1 {
      background: rgba(14, 165, 233, 0.12);
      color: #38bdf8;
    }
    .token-btn.t1.active {
      background: var(--t1);
      color: white;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(14, 165, 233, 0.4);
    }

    .token-btn.t2 {
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
    }
    .token-btn.t2.active {
      background: var(--t2);
      color: white;
      border-color: #34d399;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
    }

    /* Pestañas Cámara / Mapa */
    .mode-bar {
      display: flex;
      background: #090d16;
      padding: 6px 12px;
      gap: 6px;
    }
    .mode-btn {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #1e293b;
      color: var(--text);
      border-color: #334155;
    }

    /* Área de Visualización / Cámara */
    .view-area {
      position: relative;
      background: #000;
      min-height: 220px;
      max-height: 38vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #camera-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cam-overlay {
      position: absolute;
      top: 10px;
      background: rgba(15, 23, 42, 0.85);
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #cbd5e1;
      pointer-events: none;
    }

    /* Grid de Países */
    .countries-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      background: #0b0f19;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .country-card {
      background: #131a29;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      cursor: pointer;
      text-align: left;
      transition: transform 0.1s ease;
    }
    .country-card:active { transform: scale(0.96); }

    .country-card .c-name {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text);
    }
    .country-card .c-info {
      font-size: 0.68rem;
      color: var(--muted);
    }

    .country-card.sel-t1 {
      border-color: var(--t1);
      background: rgba(14, 165, 233, 0.18);
    }
    .country-card.sel-t2 {
      border-color: var(--t2);
      background: rgba(16, 185, 129, 0.18);
    }

    /* Panel HUD Inferior */
    .hud {
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hud-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .hud-card {
      background: #0f172a;
      border-radius: 8px;
      padding: 8px;
      border-left: 3px solid #334155;
    }
    .hud-card.t1 { border-left-color: var(--t1); }
    .hud-card.t2 { border-left-color: var(--t2); }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      font-weight: 800;
    }
    .t1 .hud-header { color: var(--t1); }
    .t2 .hud-header { color: var(--t2); }

    .hud-btn-del {
      background: #1e293b;
      border: none;
      color: #94a3b8;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.65rem;
      cursor: pointer;
    }

    .hud-country {
      font-weight: 800;
      font-size: 0.88rem;
      margin: 2px 0;
    }

    .hud-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #f59e0b;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- Cabecera -->
  <header class="header">
    <div class="brand">
      <span>💨 Protobject Turbinas</span>
    </div>
    <div class="proto-badge">
      <span class="dot"></span>
      <span>Protobject Activo</span>
    </div>
  </header>

  <!-- Selector de Ficha a colocar -->
  <div class="token-selector">
    <button id="btn-t1" class="token-btn t1 active" onclick="selectToken(1)">
      🔵 Ficha 1 (Turbina 1)
    </button>
    <button id="btn-t2" class="token-btn t2" onclick="selectToken(2)">
      🟢 Ficha 2 (Turbina 2)
    </button>
  </div>

  <!-- Barra de Modo: Cámara vs Táctil -->
  <div class="mode-bar">
    <button id="mode-cam" class="mode-btn active" onclick="setMode('cam')">📷 Cámara Escáner</button>
    <button id="mode-grid" class="mode-btn" onclick="setMode('grid')">🗺️ Selector de Países</button>
  </div>

  <!-- Vista Cámara -->
  <div class="view-area" id="view-camera">
    <video id="camera-video" autoplay playsinline muted></video>
    <div class="cam-overlay">🎯 Apunta al mapa físico sobre cada país</div>
  </div>

  <!-- Lista de Países de América -->
  <div class="countries-container" id="countries-list">
    <div class="section-title">Colocar Ficha Seleccionada en:</div>
    <div class="grid" id="grid-countries"></div>
  </div>

  <!-- HUD Inferior Comparativo -->
  <div class="hud">
    <div class="hud-grid">
      <!-- Turbina 1 -->
      <div class="hud-card t1">
        <div class="hud-header">
          <span>TURBINA 1 (Pin 5)</span>
          <button class="hud-btn-del" onclick="removeCountry(1)">✕</button>
        </div>
        <div class="hud-country" id="hud-t1-name">— Vacía —</div>
        <div class="hud-meta" id="hud-t1-meta">2000–2025: Detenida</div>
      </div>

      <!-- Turbina 2 -->
      <div class="hud-card t2">
        <div class="hud-header">
          <span>TURBINA 2 (Pin 5)</span>
          <button class="hud-btn-del" onclick="removeCountry(2)">✕</button>
        </div>
        <div class="hud-country" id="hud-t2-name">— Vacía —</div>
        <div class="hud-meta" id="hud-t2-meta">2000–2025: Detenida</div>
      </div>
    </div>
  </div>

  <script>
    const COUNTRIES = [
      { name: "Argentina", flag: "🇦🇷", wind: "12.2% viento" },
      { name: "Bolivia", flag: "🇧🇴", wind: "2.0% viento" },
      { name: "Brazil", flag: "🇧🇷", wind: "15.2% viento" },
      { name: "Canada", flag: "🇨🇦", wind: "8.0% viento" },
      { name: "Chile", flag: "🇨🇱", wind: "13.1% viento" },
      { name: "Colombia", flag: "🇨🇴", wind: "0.2% viento" },
      { name: "Costa Rica", flag: "🇨🇷", wind: "13.1% viento" },
      { name: "Cuba", flag: "🇨🇺", wind: "0.4% viento" },
      { name: "Ecuador", flag: "🇪🇨", wind: "0.4% viento" },
      { name: "Guatemala", flag: "🇬🇹", wind: "2.5% viento" },
      { name: "Honduras", flag: "🇭🇳", wind: "9.2% viento" },
      { name: "Mexico", flag: "🇲🇽", wind: "5.6% viento" },
      { name: "Nicaragua", flag: "🇳🇮", wind: "14.8% viento" },
      { name: "Panama", flag: "🇵🇦", wind: "7.1% viento" },
      { name: "Paraguay", flag: "🇵🇾", wind: "0.0% viento" },
      { name: "Peru", flag: "🇵🇪", wind: "3.7% viento" },
      { name: "United States", flag: "🇺🇸", wind: "10.3% viento" },
      { name: "Uruguay", flag: "🇺🇾", wind: "40.6% viento" },
      { name: "Venezuela", flag: "🇻🇪", wind: "0.1% viento" }
    ];

    let activeToken = 1;
    let assignedT1 = null;
    let assignedT2 = null;
    let camStream = null;

    function selectToken(num) {
      activeToken = num;
      document.getElementById("btn-t1").classList.toggle("active", num === 1);
      document.getElementById("btn-t2").classList.toggle("active", num === 2);
    }

    function setMode(mode) {
      document.getElementById("mode-cam").classList.toggle("active", mode === "cam");
      document.getElementById("mode-grid").classList.toggle("active", mode === "grid");
      const camView = document.getElementById("view-camera");
      camView.style.display = mode === "cam" ? "flex" : "none";

      if (mode === "cam") {
        startCam();
      } else {
        stopCam();
      }
    }

    async function startCam() {
      try {
        if (camStream) stopCam();
        camStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } }
        });
        document.getElementById("camera-video").srcObject = camStream;
      } catch(e) {
        console.warn("Cámara no disponible:", e);
      }
    }

    function stopCam() {
      if (camStream) {
        camStream.getTracks().forEach(t => t.stop());
        camStream = null;
      }
    }

    // ENVIAR ACCIÓN MEDIANTE PROTOBJECT AL COMPUTADOR
    function placeTokenOnCountry(countryName) {
      if (activeToken === 1) {
        assignedT1 = countryName;
      } else {
        assignedT2 = countryName;
      }

      updateUI();

      // Enviar mensaje directo con Protobject hacia index.html
      try {
        Protobject.Core.send({
          turbine: activeToken,
          action: "set_country",
          country: countryName
        }).to("index.html");
      } catch (err) {
        console.error("Error enviando por Protobject:", err);
      }
    }

    function removeCountry(turbineNum) {
      if (turbineNum === 1) assignedT1 = null;
      if (turbineNum === 2) assignedT2 = null;

      updateUI();

      try {
        Protobject.Core.send({
          turbine: turbineNum,
          action: "remove"
        }).to("index.html");
      } catch(err) {
        console.error("Error removiendo por Protobject:", err);
      }
    }

    function updateUI() {
      document.getElementById("hud-t1-name").textContent = assignedT1 ? `🇦 ${assignedT1}` : "— Vacía —";
      document.getElementById("hud-t2-name").textContent = assignedT2 ? `🇧 ${assignedT2}` : "— Vacía —";

      document.querySelectorAll(".country-card").forEach(c => {
        const name = c.dataset.name;
        c.classList.toggle("sel-t1", name === assignedT1);
        c.classList.toggle("sel-t2", name === assignedT2);
      });
    }

    // Recibir sincronización en tiempo real desde index.html vía Protobject
    try {
      Protobject.Core.onReceived(function(data) {
        if (data && data.type === "SYNC") {
          const tId = data.turbine;
          const metaEl = document.getElementById(`hud-t${tId}-meta`);
          if (metaEl) {
            metaEl.textContent = `Año: ${data.year} • ${data.share}% eólico`;
          }
        }
      });
    } catch(e) {}

    // Generar lista de países
    window.addEventListener("DOMContentLoaded", () => {
      const grid = document.getElementById("grid-countries");
      COUNTRIES.forEach(c => {
        const div = document.createElement("div");
        div.className = "country-card";
        div.dataset.name = c.name;
        div.innerHTML = `
          <div class="c-name">${c.flag} ${c.name}</div>
          <div class="c-info">${c.wind}</div>
        `;
        div.onclick = () => placeTokenOnCountry(c.name);
        grid.appendChild(div);
      });

      startCam();
    });
  </script>
</body>
</html>
